<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venom Button</title>
<style>
  :root { color-scheme: light; --bg-a:#ffffff; --bg-b:#dcdcdf; }
  html, body { height:100%; margin:0; }
  body {
    display:grid; place-items:center; overflow:hidden; touch-action:none;
    background: radial-gradient(ellipse at 50% 42%, var(--bg-a) 0%, var(--bg-b) 100%);
    font-family: "Helvetica Neue", "Inter", Arial, sans-serif;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
  #btn {
    position:relative; z-index:2; border:0; cursor:pointer; outline-offset:6px;
    width:min(340px, 78vw); height:92px; border-radius:999px;
    color:#fff; font:800 34px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing:-0.045em;
    background: linear-gradient(180deg, #34343a 0%, #0c0c0e 46%, #000 100%);
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,.38),
      inset 0 -9px 16px rgba(0,0,0,.9),
      inset 0 0 0 1px rgba(255,255,255,.07),
      0 1px 0 rgba(255,255,255,.95),
      0 22px 34px -12px rgba(0,0,0,.5);
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    will-change: transform;
  }
  #btn::before { /* glossy streak */
    content:""; position:absolute; left:7%; right:7%; top:6%; height:38%;
    border-radius:999px 999px 60% 60% / 100% 100% 40% 40%;
    background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0));
    pointer-events:none;
  }
  #btn::after { /* slow oily sheen */
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.09) 48%, transparent 60%);
    background-size:250% 100%; animation: sheen 5s ease-in-out infinite;
  }
  @keyframes sheen { 0%{background-position:120% 0} 100%{background-position:-60% 0} }
  #btn span { position:relative; display:inline-block; }
  #btn.pop { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0%{scale:1} 30%{scale:.94 .86} 100%{scale:1} }
  @media (prefers-reduced-motion: reduce) { #btn::after { animation:none } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="btn" type="button"><span>Let’s FUCK</span></button>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
  let W, H;
  const resize = () => {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  };
  addEventListener('resize', resize); resize();

  const mouse = { x: -9999, y: -9999, active: false };
  const setM = e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; };
  addEventListener('pointermove', setM);
  addEventListener('pointerdown', setM);
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') mouse.active = false; });
  document.addEventListener('mouseleave', () => mouse.active = false);

  const ENGAGE = 230, BREAK = 380, N = 24, COUNT = 12;
  const geo = { cx: 0, cy: 0, hw: 0, hh: 0 };
  const sd = (px, py) => {            // signed distance to the pill, centred on the button
    const qx = Math.abs(px) - (geo.hw - geo.hh), qy = Math.abs(py);
    return Math.hypot(Math.max(qx, 0), qy) - geo.hh;
  };
  const edge = ang => {               // point just inside the pill edge along an angle
    const dx = Math.cos(ang), dy = Math.sin(ang);
    let lo = 0, hi = geo.hw + 20;
    for (let i = 0; i < 16; i++) { const m = (lo + hi) / 2; sd(dx * m, dy * m) < 0 ? lo = m : hi = m; }
    return [geo.cx + dx * (lo - 8), geo.cy + dy * (lo - 8)];
  };
  const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

  class Strand {
    constructor(i) {
      this.k = i / (COUNT - 1) - .5;
      this.baseW = 5 + Math.random() * 5;
      this.phase = Math.random() * 6.28;
      this.ease = .07 + Math.random() * .09;
      this.breakAt = BREAK + (Math.random() - .5) * 90;
      this.ang = 0; this.len = 0; this.tension = 0;
      this.state = 'idle'; this.wait = 0;
      this.pts = Array.from({ length: N }, () => ({ x: 0, y: 0, px: 0, py: 0 }));
    }
    root() { return edge(this.ang); }
    start(baseAng) {
      this.state = 'live'; this.ang = baseAng + this.k * .9;
      const [rx, ry] = this.root();
      this.pts.forEach(p => { p.x = p.px = rx; p.y = p.py = ry; });
      this.len = 4;
    }
    snap() {
      this.state = 'recoil';
      const r = this.pts[0], tip = this.pts[N - 1];
      for (let i = 1; i < N; i++) {          // whip back toward the root
        const p = this.pts[i];
        p.px = p.x + (p.x - r.x) * .1 + (Math.random() - .5) * 14;
        p.py = p.y + (p.y - r.y) * .1 + (Math.random() - .5) * 14;
      }
      for (let i = 0; i < 5; i++) drops.push({
        x: tip.x, y: tip.y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 4,
        r: 1.5 + Math.random() * 3, life: 50 + Math.random() * 30
      });
    }
    step(t, base) {
      const pts = this.pts, tip = pts[N - 1];
      let [rx, ry] = [pts[0].x, pts[0].y];
      if (this.state === 'live') {
        const target = Math.atan2(mouse.y - geo.cy, mouse.x - geo.cx) + this.k * .9;
        this.ang += angDiff(target, this.ang) * .15;
      }
      [rx, ry] = this.root(); pts[0].x = rx; pts[0].y = ry;

      const dC = Math.hypot(mouse.x - rx, mouse.y - ry);
      if (this.state === 'live') {
        if (!mouse.active || dC > this.breakAt) { this.snap(); }
        else {
          this.tension = Math.min(Math.max((dC - ENGAGE * .6) / (this.breakAt - ENGAGE * .6), 0), 1);
          const tx = mouse.x + Math.sin(this.phase) * 5, ty = mouse.y + Math.cos(this.phase) * 5;
          tip.x += (tx - tip.x) * this.ease; tip.y += (ty - tip.y) * this.ease; tip.px = tip.x; tip.py = tip.y;
          const dT = Math.hypot(tip.x - rx, tip.y - ry);
          const lenT = dT * 1.08 + 24 * (1 - this.tension);
          this.len += (lenT - this.len) * .3;
        }
      }
      if (this.state === 'recoil') {
        this.len *= .93; this.tension = 0;
        if (this.len < 5) { this.state = 'idle'; this.wait = Math.random() * 25; return; }
      }
      const s = this.len / (N - 1), pinTip = this.state === 'live';
      const sway = .16 * (1 - this.tension);
      for (let i = 1; i < N; i++) {
        if (pinTip && i === N - 1) continue;
        const p = pts[i], vx = (p.x - p.px) * .965, vy = (p.y - p.py) * .965;
        p.px = p.x; p.py = p.y;
        const f = Math.sin(t * 2.4 + i * .55 + this.phase) * sway * (i / N);
        p.x += vx + f; p.y += vy + .12 + Math.cos(t * 2 + i * .5 + this.phase) * sway * .6 * (i / N);
      }
      for (let k = 0; k < 9; k++) {
        pts[0].x = rx; pts[0].y = ry;
        for (let i = 0; i < N - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const ia = i === 0 ? 0 : 1, ib = (pinTip && i + 1 === N - 1) ? 0 : 1, sum = ia + ib;
          if (!sum) continue;
          let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || .0001;
          const diff = (d - s) / d;
          a.x += dx * diff * ia / sum; a.y += dy * diff * ia / sum;
          b.x -= dx * diff * ib / sum; b.y -= dy * diff * ib / sum;
        }
      }
    }
    draw(t) {
      if (this.state === 'idle') return;
      const pts = this.pts, w0 = this.baseW * (1 - .5 * this.tension);
      const L = [], R = [], nrm = [];
      for (let i = 0; i < N; i++) {
        const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, N - 1)];
        let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 1;
        nrm.push([-dy / d, dx / d]);
        const u = i / (N - 1), w = w0 * Math.pow(1 - u, .75) + 1.1;
        L.push([pts[i].x + nrm[i][0] * w, pts[i].y + nrm[i][1] * w]);
        R.push([pts[i].x - nrm[i][0] * w, pts[i].y - nrm[i][1] * w]);
      }
      ctx.fillStyle = '#050506';
      ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
      for (let i = 1; i < N; i++) ctx.lineTo(L[i][0], L[i][1]);
      for (let i = N - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
      ctx.closePath(); ctx.fill();
      // sketchy hairline sub-strands
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
      for (let h = 0; h < 2; h++) {
        ctx.beginPath();
        for (let i = 0; i < N; i++) {
          const o = Math.sin(i * .6 + t * 3 + this.phase + h * 2.4) * (w0 * 1.5) * Math.sin(Math.PI * i / (N - 1));
          const x = pts[i].x + nrm[i][0] * o, y = pts[i].y + nrm[i][1] * o;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
      }
      // wet highlight
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = .9; ctx.beginPath();
      for (let i = 0; i < N * .7; i++) {
        const w = w0 * Math.pow(1 - i / (N - 1), .75) * .35;
        const x = pts[i].x + nrm[i][0] * w, y = pts[i].y + nrm[i][1] * w;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
      if (this.state === 'live') {       // goo glob clinging to the cursor
        const tp = pts[N - 1];
        ctx.fillStyle = '#050506'; ctx.beginPath(); ctx.arc(tp.x, tp.y, 2.6 + (1 - this.tension) * 2, 0, 6.283); ctx.fill();
      }
    }
  }

  const strands = Array.from({ length: COUNT }, (_, i) => new Strand(i));
  const drops = [];
  let lean = { x: 0, y: 0 };

  btn.addEventListener('click', () => {
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * 6.283;
      const [x, y] = edge(a);
      drops.push({ x, y, vx: Math.cos(a) * (2 + Math.random() * 4), vy: Math.sin(a) * (2 + Math.random() * 4) - 1, r: 2 + Math.random() * 3.5, life: 45 + Math.random() * 35 });
    }
  });

  function step(t) {
    const r = btn.getBoundingClientRect();
    geo.cx = r.left + r.width / 2; geo.cy = r.top + r.height / 2; geo.hw = r.width / 2; geo.hh = r.height / 2;
    const dist = Math.max(sd(mouse.x - geo.cx, mouse.y - geo.cy), 0);
    const baseAng = Math.atan2(mouse.y - geo.cy, mouse.x - geo.cx);
    let liveN = 0, tens = 0;
    for (const s of strands) {
      if (s.state === 'idle' && mouse.active && dist < ENGAGE && --s.wait <= 0) s.start(baseAng);
      if (s.state !== 'idle') s.step(t, baseAng);
      if (s.state === 'live') { liveN++; tens += s.tension; }
    }
    const pull = liveN ? (liveN / COUNT) * (.4 + .6 * tens / liveN) * 9 : 0;   // button leans toward the cursor
    const dx = mouse.x - geo.cx, dy = mouse.y - geo.cy, dl = Math.hypot(dx, dy) || 1;
    lean.x += (dx / dl * pull - lean.x) * .15; lean.y += (dy / dl * pull - lean.y) * .15;
    btn.style.transform = `translate(${lean.x.toFixed(2)}px,${lean.y.toFixed(2)}px)`;
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.vy += .25; d.x += d.vx; d.y += d.vy; d.vx *= .985; d.life--;
      if (d.life <= 0) drops.splice(i, 1);
    }
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min((now - last) / 1000, .05); last = now;
    while (acc >= 1 / 60) { step(now / 1000); acc -= 1 / 60; }
    ctx.clearRect(0, 0, W, H);
    for (const d of drops) {
      ctx.fillStyle = '#050506'; ctx.beginPath();
      ctx.ellipse(d.x, d.y, d.r * Math.max(Math.min(d.life / 25, 1), .2), d.r * Math.max(Math.min(d.life / 25, 1), .2) * (1 + Math.abs(d.vy) * .08), 0, 0, 6.283); ctx.fill();
    }
    for (const s of strands) s.draw(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
